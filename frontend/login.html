<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - Bijoy 24 Hall</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-section {
            min-height: calc(100vh - 80px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .auth-container {
            background: white;
            border-radius: 20px;
            padding: 2rem;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        .auth-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 2px solid #f0f0f0;
        }

        .auth-tab {
            flex: 1;
            padding: 1rem;
            background: none;
            border: none;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            color: #666;
            transition: all 0.3s;
        }

        .auth-tab.active {
            color: #667eea;
            border-bottom: 2px solid #667eea;
            margin-bottom: -2px;
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
            animation: fadeIn 0.5s;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #333;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .btn-primary {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<header>
    <nav>
        <div class="logo">
            <div class="logo-icon">B24</div>
            <h1>Bijoy 24 Hall</h1>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="index.html#features">Features</a></li>
            <li><a href="index.html#about">About</a></li>
            <li><a href="index.html#contact">Contact</a></li>
        </ul>
    </nav>
</header>

<section class="auth-section">
    <div class="auth-container">
        <div class="auth-tabs">
            <button class="auth-tab active" onclick="showStudentLogin()">Login</button>
            <button class="auth-tab" onclick="showStudentRegister()">Register</button>
        </div>

        <!-- Login Form -->
        <div id="studentLoginForm" class="auth-form active">
            <form onsubmit="handleStudentLogin(event)">
                <div class="form-group">
                    <label>Email or Student ID</label>
                    <input type="text" id="studentLoginEmail" placeholder="Enter your email or student ID" required>
                </div>
                
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="studentLoginPassword" placeholder="Enter your password" required>
                </div>
                
                <button type="submit" class="btn-primary">Login</button>
            </form>
        </div>

        <!-- Register Form -->
        <div id="studentRegisterForm" class="auth-form">
            <form onsubmit="handleStudentRegister(event)">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="studentRegName" placeholder="Enter your full name" required>
                </div>
                
                <div class="form-group">
                    <label>Student ID</label>
                    <input type="text" id="studentRegNo" placeholder="Enter your student ID" required>
                </div>
                
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="studentRegEmail" placeholder="Enter your email" required>
                </div>
                
                <div class="form-group">
                    <label>Department</label>
                    <select id="studentRegDepartment" required>
                        <option value="">Select Department</option>
                        <option value="CSE">Computer Science & Engineering</option>
                        <option value="EEE">Electrical & Electronic Engineering</option>
                        <option value="ME">Mechanical Engineering</option>
                        <option value="CE">Civil Engineering</option>
                        <option value="Pharmacy">Pharmacy</option>
                        <option value="Physics">Physics</option>
                        <option value="Chemistry">Chemistry</option>
                        <option value="Mathematics">Mathematics</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="studentRegPhone" placeholder="Enter your phone number" required>
                </div>
                
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="studentRegPassword" placeholder="Create a password (min 6 characters)" required>
                </div>
                
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="studentRegConfirmPassword" placeholder="Confirm your password" required>
                </div>
                
                <button type="submit" class="btn-primary">Register</button>
            </form>
        </div>
    </div>
</section>

<script src="student-auth.js"></script>

</body>
</html>
