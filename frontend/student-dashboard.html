<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - Bijoy 24 Hall</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: #f4f6f9;
        }

        .dashboard-layout {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 260px;
            background: #1f2937;
            color: white;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .logo-box {
            width: 40px;
            height: 40px;
            background: #4f46e5;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            font-weight: bold;
        }

        .nav {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .nav a {
            text-decoration: none;
            color: #d1d5db;
            padding: 10px;
            border-radius: 8px;
        }

        .nav a:hover {
            background: #374151;
            color: white;
        }

        .logout-btn {
            margin-top: auto;
            background: #ef4444;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
        }

        .main {
            flex: 1;
        }

        .topbar {
            background: white;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .content {
            padding: 25px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
        }
    </style>
</head>

<body>

<div class="dashboard-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo">
            <div class="logo-box">B24</div>
            <h2>Bijoy 24 Hall</h2>
        </div>

        <nav class="nav">
            <a href="dashboard.html">Dashboard</a>
            <a href="admission.html">Admission</a>
            <a href="complaints.html">Complaints</a>
            <a href="dining.html">Dining</a>
            <a href="library.html">Library</a>
        </nav>

        <!-- FIXED LOGOUT -->
        <button class="logout-btn" id="logoutBtn">Logout</button>

    </aside>

    <!-- MAIN -->
    <main class="main">

        <div class="topbar">
            <div>Welcome, <span id="userName">Student</span></div>
            <div id="userInitial">S</div>
        </div>

        <div class="content">

            <div class="cards">

                <div class="card">
                    <h3>Application Status</h3>
                    <p id="applicationStatus">Loading...</p>
                </div>

                <div class="card">
                    <h3>Room</h3>
                    <p id="roomNumber">Not Allocated</p>
                </div>

                <div class="card">
                    <h3>Fee Status</h3>
                    <p id="feeStatus">Pending</p>
                </div>

                <div class="card">
                    <h3>Hall Card</h3>
                    <p id="hallCard">Not Issued</p>
                </div>

            </div>

        </div>

    </main>

</div>

<script src="./dashboard.js"></script>

</body>
</html>
